# Workflow name
name: Lab 2 - Report Pipeline

# Workflow triggers
on:
  workflow_dispatch:   # Manual trigger from GitHub Actions

  push:
    branches: [ main ] # Trigger on push to main

# Workflow jobs
jobs:

  # Job that runs tests and generates the report
  test-report:

    # GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Environment variables available to all job steps
    env:
      ENVIRONMENT: test
      APP_NAME: gha-lab-02-report

    # Job steps
    steps:

      # Download repository files to the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the required Node.js version
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # Node.js version
          # cache: 'npm'     # Optional npm dependency cache

      # Install project dependencies
      - name: Install dependencies
        run: npm install

      # Run application tests
      - name: Run tests
        run: npm test

      # Create the test report file
      - name: Generate test report
        run: |
          mkdir -p reports
          echo "Application: $APP_NAME" > reports/test-report.txt
          echo "Environment: $ENVIRONMENT" >> reports/test-report.txt
          echo "Tests: PASSED" >> reports/test-report.txt
          echo "Generated at: $(date)" >> reports/test-report.txt
          cat reports/test-report.txt

      # Save the test report as a GitHub artifact
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report                  # Artifact name
          path: reports/test-report.txt      # File to upload


# Job that downloads, reads, and validates the generated report
  report:
  
    # Run only after test-report succeeds
    needs: test-report
  
    # GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest
  
    # Environment variables available to all job steps
    env:
      ENVIRONMENT: test
      APP_NAME: gha-lab-02-report
  
    # Job steps
    steps:
  
      # Download the artifact generated by the previous job
      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report       # Artifact to download
          path: reports           # Destination folder


      # Display the downloaded report
      - name: Read test report
        run: cat reports/test-report.txt

      # Verify that the repository secret is available
      - name: Check report token
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          if [ -z "$REPORT_TOKEN" ]; then
            echo "REPORT_TOKEN is missing"
            exit 1
          fi
          echo "REPORT_TOKEN is configured"

      # Validate the test result stored in the report
      - name: Validate test report
        run: |
          if grep -q "Tests: PASSED" reports/test-report.txt; then
            echo "Report validation successful"
          else
            echo "Report validation failed"
            exit 1
          fi